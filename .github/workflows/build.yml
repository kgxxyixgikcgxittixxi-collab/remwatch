name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
      - uses: android-actions/setup-android@v3
      - name: Get Gradle
        run: |
          curl -sL -o g.zip https://services.gradle.org/distributions/gradle-6.9.4-bin.zip
          unzip -q g.zip
      - name: Build
        run: ./gradle-6.9.4/bin/gradle assembleDebug --no-daemon
      - name: Clean old release
        run: gh release delete v1 --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1
          files: app/build/outputs/apk/debug/app-debug.apk
